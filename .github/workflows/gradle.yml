name: Gradle Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Run Gradle build
      run: ./gradlew clean build
    
    - name: Upload build artifact jar
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: twitchvotesminecraft
        path: app/build/libs/twitchvotesminecraft.jar
        # v7 supports non-zipped artifacts directly (use archive=false)
        archive: false
