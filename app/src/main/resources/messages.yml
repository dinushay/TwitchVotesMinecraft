  cannot-save-lore1: "&7Event + Vote seconds cannot"
  cannot-save-lore2: "&7exceed Interval seconds!"
  close: "&c&lClose"
  close-lore: "&7Click to close without saving."
  cannot-save-msg: "&c[TwitchVotesMinecraft] Cannot save! Event Seconds (%event%s) + Vote Seconds (%vote%s) = %sum%s, which exceeds Interval Seconds (%interval%s)."
