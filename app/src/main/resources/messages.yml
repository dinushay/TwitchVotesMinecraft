# Message Configuration for TwitchVotesMinecraft
# Color codes use the '&' symbol (e.g., &a for Green, &c for Red).

general:
  prefix: "<b><gradient:#FF7C00:#FFC400>TwitchV</gradient><gradient:#FFC400:#FFC400>otesMinecraft</gradient></b><dark_gray> ┃  </dark_gray><reset>"
  only-in-game: "&cOnly in-game players can execute this command."
  must-be-op: "%prefix%&cYou must be a server Operator (OP) to use this command."
  usage: "&cUsage: /%cmd% <twitch-name | cancel>"
  invalid-syntax: "%prefix%&cInvalid Twitch username syntax! Usernames must be 4-25 alphanumeric characters or underscores."
  verifying: "%prefix%&eVerifying Twitch channel '%channel%'..."
  channel-not-found: "%prefix%&cTwitch channel '%channel%' does not exist!"

session:
  cancelled: "%prefix%&aActive Twitch voting session cancelled."
  no-active-session: "%prefix%&cYou do not have an active voting session to cancel."
  connected: "%prefix%&aConnected to Twitch channel #%channel%. Starting voting cycle!"
  player-died: "%prefix%&cYou died! Active Twitch voting session has been cancelled."
  vote-ended: "%prefix%&aVoting ended! Winner: &e%event% &a(%percent%% votes)! Executing now..."

gui:
  title: "&8Twitch Settings - &5%channel%"
  interval-seconds: "&eInterval Seconds: &b%val%s"
  event-seconds: "&eEvent Seconds: &b%val%s"
  vote-seconds: "&eVote Seconds: &b%val%s"
  max-events: "&eMax Voteable Events: &b%val%"
  click-modify: "&7Left-Click: &a+5s &7| Right-Click: &c-5s"
  click-modify-small: "&7Left-Click: &a+1 &7| Right-Click: &c-1"
  range-time: "&7Range: 15s - 120s"
  range-count: "&7Range: 2 - 5"
  confirm: "&a&lSave & Start Session"
  confirm-lore: "&7Click to save settings and start voting session."
  cannot-save: "&c&lCannot Save"
  cannot-save-lore1: "&7Event + Vote seconds cannot"
  cannot-save-lore2: "&7exceed Interval seconds!"
  close: "&c&lClose"
  close-lore: "&7Click to close without saving."
  cannot-save-msg: "%prefix%&cCannot save! Event Seconds (%event%s) + Vote Seconds (%vote%s) = %sum%s, which exceeds Interval Seconds (%interval%s)."
  saved-msg: "%prefix%&aDefault settings successfully saved to config.yml! Starting voting session..."

bossbar:
  voting: "&d&lVoting ends in: &e%time%s"
  event-active: "&e&lEvent Active (&a%event%&e): &f%time%s"
  next-vote: "&b&lNext voting in: &e%time%s"

scoreboard:
  title: "&5&lTwitch Vote"
  total-votes: "&7Total Votes: &f%total%"

